apiVersion: v1
data:
  application.yml: "server:\n  port: 8085\nspring:\n  mvc:\n    pathmatch:\n      matching-strategy:
    ant_path_matcher\n  datasource:\n    url: jdbc:mysql://192.168.2.12:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true\n
    \   username: root\n    password: excel_processor\n    druid:\n      initial-size:
    5 #连接池初始化大小\n      min-idle: 10 #最小空闲连接数\n      max-active: 20 #最大连接数\n      web-stat-filter:\n
    \       exclusions: \"*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*\" #不统计这些请求数据\n
    \     stat-view-servlet: #访问监控网页的登录用户名和密码\n        login-username: druid\n        login-password:
    druid\n  data:\n    mongodb:\n      host: 192.168.2.15\n      port: 27017\n      database:
    mall\n      username: admin\n      password: mall123\n      authentication-database:
    admin\n    \n    redis:\n      key:\n        authCode: 'ums:authCode'\n        orderId:
    'oms:orderId'\n        member: 'ums:member'\n      expire:\n        authCode:
    90 # 验证码超期时间\n        common: 86400 # 24小时\n      host: redis-master.redis.svc.cluster.local
    \ # ✅ 修改为你的 Redis 地址\n      database: 0\n      port: 6379  # ✅ 修改为你的 Redis 端口\n
    \     password: redis123  # ✅ 添加密码\n      timeout: 3000ms\n\n  rabbitmq:\n    host:
    192.168.2.15\n    port: 5672\n    virtual-host: /mall\n    username: mall\n    password:
    mall\n\n\nmybatis:\n  mapper-locations:\n    - classpath:dao/*.xml\n    - classpath*:com/**/mapper/*.xml\nmanagement:\n
    \ endpoints:\n    web:\n      exposure:\n        include: '*' #暴露Actuator的监控端点\n
    \ endpoint:\n    health:\n      show-details: always #显示健康的详细信息\n    env:\n      show-values:
    always #默认Actuator的环境变量会以****显示，这里开启显示\n    configprops:\n      show-values: always
    #默认Actuator的配置属性会以****显示，这里开启显示\n    info:\n      enabled: true\nredis:\n  # database:
    mall-swarm\n  key:\n    authCode: 'ums:authCode'\n    orderId: 'oms:orderId'\n
    \   member: 'ums:member'\n  expire:\n    authCode: 90 # 验证码超期时间\n    common: 86400
    # 24小时\n  host: redis-master.redis.svc.cluster.local  # ✅ 修改为你的 Redis 地址\n  database:
    mall-swarm\n  port: 6379  # ✅ 修改为你的 Redis 端口\n  password: redis123  # ✅ 添加密码\n
    \ timeout: 3000ms\n\nrabbitmq:\n  queue:\n    name:\n      cancelOrder: cancelOrderQueue\nspringdoc:\n
    \ swagger-ui:\n    # 修改Swagger UI路径\n    path: /swagger-ui.html\n    # 开启Swagger
    UI界面\n    enabled: true\n    # 用于配置tag和operation的展开方式，这里配置为都不展开\n    doc-expansion:
    'none'\n  api-docs:\n    # 修改api-docs路径\n    path: /v3/api-docs\n    # 开启api-docs\n
    \   enabled: true\n  group-configs:\n    - group: 'mall-portal'\n      packages-to-scan:
    com.macro.mall.portal.controller\nsa-token:\n  # token名称 (同时也是cookie名称)\n  token-name:
    Authorization\n  # token有效期，单位秒，-1代表永不过期\n  timeout: 604800\n  # token临时有效期 (指定时间内无操作就视为token过期)，单位秒\n
    \ active-timeout: -1\n  # 是否允许同一账号并发登录 (为false时新登录挤掉旧登录)\n  is-concurrent: true\n
    \ # 在多人登录同一账号时，是否共用一个token (为false时每次登录新建一个token)\n  is-share: false\n  # token风格\n
    \ token-style: uuid\n  # 是否输出操作日志\n  is-log: false\n  # 是否从cookie中读取token\n  is-read-cookie:
    false\n  # 是否从head中读取token\n  is-read-header: true\n  # token前缀\n  token-prefix:
    Bearer\n  # jwt秘钥\n  jwt-secret-key: sa-secret-key123\n  # 是否打印banner\n  is-print:
    false\n"
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: mall-portal-config
  namespace: master
