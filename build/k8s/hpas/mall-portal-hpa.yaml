
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mall-portal-hpa
  namespace: master
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mall-portal
  minReplicas: 2
  maxReplicas: 5  # 门户服务需要应对流量高峰
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 150
        periodSeconds: 10