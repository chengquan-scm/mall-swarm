apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mall-gateway-hpa
  namespace: master
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mall-gateway
  minReplicas: 2
  maxReplicas: 10  # 网关需要更大的扩缩范围应对流量波动
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # 网关 CPU 目标更低以确保稳定性
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15