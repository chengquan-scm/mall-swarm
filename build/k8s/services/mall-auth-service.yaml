## 🔌 Auth Service 配置
apiVersion: v1
kind: Service
metadata:
  name: mall-auth
  namespace: master
  labels:
    app: mall-auth
    version: "master-fe0ec72-98"
spec:
  type: ClusterIP
  selector:
    app: mall-auth
  ports:
    - name: http
      port: 8401
      targetPort: 8401
      protocol: TCP
