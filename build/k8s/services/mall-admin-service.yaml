## 🔌 Service 配置（详细注释版）
apiVersion: v1 # 使用核心 v1 API 版本
kind: Service # 资源类型为 Service，用于暴露 Pod 网络
metadata:
  name: mall-admin # Service 名称
  namespace: master # 与 Deployment 相同的命名空间
  labels:
    app: mall-admin # 服务标签
    version: "master-cc335cf-103" # 版本标签
spec:
  type: ClusterIP # Service 类型：集群内部 IP，只能在集群内访问
  # -------- Pod 选择器 --------
  selector:
    app: mall-admin # 选择具有 app=mall-admin 标签的 Pod 作为后端
  # -------- 端口配置 --------
  ports:
    - name: http # 端口名称，用于识别
      port: 8082 # Service 对外暴露的端口
      targetPort: 8082 # 目标 Pod 的端口，与 containerPort 对应
      protocol: TCP # 网络协议：TCP
