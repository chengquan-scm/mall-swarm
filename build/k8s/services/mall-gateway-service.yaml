apiVersion: v1
kind: Service
metadata:
  name: mall-gateway
  namespace: master
  labels:
    app: mall-gateway
    version: "master-7e03adf-97"
  annotations:
  # 如果是入口网关，可能需要 LoadBalancer
  # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer # 网关通常需要对外暴露
  selector:
    app: mall-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8201
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8201
      protocol: TCP
  sessionAffinity: None
