apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-portal
  namespace: master
  labels:
    app: mall-portal
    component: "portal-service"
spec:
  replicas: 2 # 门户服务直接面向用户，需要更多副本
  selector:
    matchLabels:
      app: mall-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2 # 门户服务可以容忍更多的临时副本
  template:
    metadata:
      labels:
        app: mall-portal
        version: "master-cc335cf-103"
        component: "portal-service"
        team: "mall-swarm-team"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http"
        business.domain: "ecommerce"
        alert.severity: "high"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        runAsGroup: 1006
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-secret
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-portal
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mall-portal
          image: core.harbor.domain/mall-swarm/master/mall-portal:master-cc335cf-103
          imagePullPolicy: IfNotPresent
          # ===== 修正安全字段：移动到 container.securityContext =====
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8085 # mall-swarm 门户服务标准端口
          env:
            - name: TZ
              value: Asia/Ho_Chi_Minh
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes,prod"
            - name: SPRING_APPLICATION_NAME
              value: "mall-portal" # 新增，避免占位符无法解析
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            - name: tmp-volume
              mountPath: /tmp # 新增挂载临时目录
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
      volumes:
        - name: config-volume
          configMap:
            name: mall-portal-config
            items:
              - key: application.yaml
                path: application.yaml
        - name: tmp-volume # 新增 emptyDir 存储卷
          emptyDir: {}
