apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-search
  namespace: master
  labels:
    app: mall-search
    component: "search-service"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mall-search
        version: "master-cc335cf-103"
        component: "search-service"
        team: "mall-swarm-team"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http"
        business.domain: "ecommerce"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1005
        runAsGroup: 1005
      imagePullSecrets:
        - name: harbor-secret
      terminationGracePeriodSeconds: 60
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-search
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mall-search
          image: core.harbor.domain/mall-swarm/master/mall-search:master-cc335cf-103
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: TZ
              value: Asia/Ho_Chi_Minh
            - name: JAVA_OPTS
              value: "-Xmx1g -Xms512m"
            - name: SPRING_APPLICATION_NAME
              value: "mall-search" # 新增，避免占位符无法解析
          # ------------------------------
          # ✔ SecurityContext 正确位置
          # ------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            - name: tmp-volume
              mountPath: /tmp # 新增挂载临时目录
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
      volumes:
        - name: config-volume
          configMap:
            name: mall-search-config
            items:
              - key: application.yaml
                path: application.yaml
        - name: tmp-volume # 新增 emptyDir 存储卷
          emptyDir: {}