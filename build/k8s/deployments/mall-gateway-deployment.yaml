# Kubernetes API 版本和资源类型定义
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: master
  labels:
    app: mall-gateway
    component: "gateway"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mall-gateway
        version: "master-fe0ec72-98"
        component: "gateway"
        team: "mall-team"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8201"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http"
        prometheus.io/interval: "30s"
        business.domain: "ecommerce"
        alert.severity: "critical" # 网关是关键组件，告警级别更高
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-secret
      terminationGracePeriodSeconds: 45 # 网关需要更长时间处理现有连接
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-gateway
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mall-gateway
          image: core.harbor.domain/mall-swarm/master/mall-gateway:master-fe0ec72-98
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8201
          env:
            - name: TZ
              value: Asia/Ho_Chi_Minh
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m" # 网关通常需要更多内存
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            - name: routes-volume
              mountPath: /app/config/routes
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8201
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8201
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
      volumes:
        - name: config-volume
          configMap:
            name: mall-gateway-config
            items:
              - key: application.yaml
                path: application.yaml
        - name: routes-volume
          configMap:
            name: mall-gateway-routes
