server:
  port: 8401
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # data:
  #   redis:
  #     host: 192.168.2.15
  #     port: 31721
  #     password: redis123
  #     database: 0
  #     timeout: 3000ms
management:
  endpoints:
    web:
      exposure:
        include: '*'  # expose Actuator endpoints
    endpoint:
      health:
        show-details: always  # show health details
      env:
        show-values: always  # show environment values
      configprops:
        show-values: always  # show configuration properties
      info:
        enabled: true
springdoc:
  swagger-ui:
    # modify Swagger UI path
    path: /swagger-ui.html
    # enable Swagger UI
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    show-extensions: true
  api-docs:
    # modify api-docs path
    path: /v3/api-docs
    # enable api-docs
    enabled: true
  group-configs:
    - group: 'default'
      packages-to-scan: com.macro.mall.auth.controller
  default-flat-param-object: false

mall:
  portal:
    url: http://mall-portal:8085
  admin:
    url: http://mall-admin:8080