# Kubernetes API 版本和资源类型定义 
apiVersion: apps/v1 # 使用 apps/v1 API 版本，这是 Deployment 的标准版本
kind: Deployment # 资源类型为 Deployment，用于管理 Pod 的部署和更新
metadata:
  name: mall-admin # Deployment 名称，在命名空间内唯一标识
  namespace: {{ .Values.global.namespace }} # 部署到的命名空间，实现资源隔离和环境分离
  labels:
    app: mall-admin # 标签用于资源识别和选择器匹配
spec:
  # -------- 副本配置 --------
  replicas: {{ .Values.replicaCount.admin }} # 期望的 Pod 副本数量，确保高可用性和负载均衡
  # -------- Pod 选择器 --------
  selector:
    matchLabels:
      app: mall-admin # 选择器用于识别由该 Deployment 管理的 Pod
  # -------- 滚动更新策略 --------
  strategy:
    type: RollingUpdate # 滚动更新策略，确保零停机部署
    rollingUpdate:
      maxUnavailable: 1 # 更新过程中最多允许 1 个 Pod 不可用（25% 的副本）
      maxSurge: 1 # 更新过程中最多可以创建 1 个超出期望副本数的 Pod
  # -------- Pod 模板 --------
  template:
    metadata:
      labels:
        app: mall-admin
        version: "{{ .Values.image.tag }}" # 添加版本标签，便于监控和故障排查
        component: "backend" # 组件类型标签
        team: "mall-team" # 负责团队标签
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http" # 明确指定 HTTP 协议
        prometheus.io/interval: "30s" # 抓取间隔
        # 可选：添加业务相关注解
        business.domain: "ecommerce" # 业务域
        alert.severity: "warning" # 告警级别
    spec:
      # -------- Pod 级安全上下文 --------
      securityContext:
        runAsNonRoot: true # 强制非 root 运行（冗余但明确）
        runAsUser: 1000 # 指定用户 ID
        runAsGroup: 1000 # 指定组 ID
      # -------- 镜像拉取密钥 --------
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }} # 用于从私有 Harbor 仓库拉取镜像的认证密钥
      # -------- 优雅终止配置 --------
      terminationGracePeriodSeconds: 30 # Pod 终止宽限期，给应用足够时间完成正在处理的请求
      # -------- 重启策略 --------
      restartPolicy: Always # 容器退出时总是重启，这是 Pod 的唯一有效值
      # -------- 亲和性调度 --------
      affinity:
        # 反亲和性：避免 Pod 集中在同一节点
        podAntiAffinity:
          # 优先调度规则（软约束），不是强制要求
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100 # 权重值，范围 1-100，影响调度决策
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In # 操作符：匹配标签值在指定列表中
                      values:
                        - mall-admin # 匹配具有 app=mall-admin 标签的 Pod
                topologyKey: "kubernetes.io/hostname" # 拓扑域，基于节点主机名进行分布
      # -------- 容器定义 --------
      containers:
        - name: mall-admin # 容器名称，在 Pod 内唯一
          image: {{ .Values.image.repository }}/mall-admin:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }} # 镜像拉取策略：如果本地存在就不拉取
          # -------- 容器级安全上下文增强 --------
          securityContext:
            allowPrivilegeEscalation: false # 禁止提权，防止容器内进程获取更高权限
            readOnlyRootFilesystem: true # 根文件系统只读，防止恶意文件写入
            runAsNonRoot: true # 强制非 root 运行（冗余但明确）
            runAsUser: 1000 # 指定用户 ID
            runAsGroup: 1000 # 指定组 ID
            capabilities:
              drop:
                - ALL # 丢弃所有 Linux capabilities，最小权限原则
            seccompProfile:
              type: RuntimeDefault # 使用默认的 seccomp 配置文件，限制系统调用
          # -------- 端口暴露 --------
          ports:
            - containerPort: 8082 # 容器监听的端口，用于服务发现
          # -------- 环境变量 --------
          env:
            - name: TZ
              value: {{ .Values.global.timezone }} # 设置容器时区为胡志明市时间
            - name: SPRING_APPLICATION_NAME
              value: mall-admin
          # -------- 存储卷挂载 --------
          volumeMounts:
            - name: config-volume # 引用下面定义的 volume 名称
              mountPath: /app/config/application.yaml # 配置文件在容器内的挂载路径
              subPath: application.yaml # 只挂载 ConfigMap 中的特定文件
            - name: tmp-volume # 新增 emptyDir 挂载
              mountPath: /tmp # 容器 /tmp 使用空目录
          # -------- 存活探针 --------
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness # 健康检查端点
              port: 8082 # 检查端口
            initialDelaySeconds: 30 # 容器启动后等待 30 秒开始第一次检查
            periodSeconds: 20 # 每 20 秒执行一次健康检查
            timeoutSeconds: 5 # 检查超时时间
            failureThreshold: 3 # 连续失败 3 次后认为容器不健康
          # -------- 就绪探针 --------
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness # 就绪检查端点
              port: 8082
            initialDelaySeconds: 10 # 比存活探针短的初始延迟
            periodSeconds: 10 # 每 10 秒检查一次
            timeoutSeconds: 5
            failureThreshold: 3 # 连续失败 3 次后将 Pod 从服务端点移除
          # -------- 资源限制 --------
          resources:
            requests: # 容器启动的最小资源需求，影响调度
              cpu: "200m" # 0.2 个 CPU 核心（200 millicores）
              memory: "256Mi" # 256 Mebibytes 内存
            limits: # 容器能使用的最大资源，防止资源耗尽
              cpu: "500m" # 0.5 个 CPU 核心
              memory: "512Mi" # 512 Mebibytes 内存
      # -------- 存储卷定义 --------
      volumes:
        - name: config-volume # 存储卷名称，与 volumeMounts 对应
          configMap:
            name: mall-admin-config # 引用的 ConfigMap 名称
            items:
              - key: application.yaml # ConfigMap 中的键名
                path: application.yaml # 挂载到容器内的文件名
        - name: tmp-volume # 新增 emptyDir 卷
          emptyDir: {} # 临时目录，Pod 生命周期内可写
---
# Kubernetes API 版本和资源类型定义
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-auth
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mall-auth
    component: "auth-service"
spec:
  # -------- 副本配置 --------
  replicas: {{ .Values.replicaCount.auth }} # 认证服务需要高可用，但副本不宜过多（会话一致性考虑）
  # -------- Pod 选择器 --------
  selector:
    matchLabels:
      app: mall-auth
  # -------- 滚动更新策略 --------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  # -------- Pod 模板 --------
  template:
    metadata:
      labels:
        app: mall-auth
        version: "{{ .Values.image.tag }}"
        component: "auth-service"
        team: "mall-swarm-team"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8401"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http"
        prometheus.io/interval: "30s"
        business.domain: "ecommerce"
        alert.severity: "critical" # 认证服务是关键组件
    spec:
      # -------- 安全上下文 --------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1004
        runAsGroup: 1004
        seccompProfile:
          type: RuntimeDefault
      # -------- 镜像拉取密钥 --------
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      # -------- 优雅终止配置 --------
      terminationGracePeriodSeconds: 45 # 认证服务需要时间处理中的令牌请求
      # -------- 重启策略 --------
      restartPolicy: Always
      # -------- 亲和性调度 --------
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-auth
                topologyKey: "kubernetes.io/hostname"
      # -------- 容器定义 --------
      containers:
        - name: mall-auth
          image: {{ .Values.image.repository }}/mall-auth:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # ===== 修正：container 级 securityContext =====
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # -------- 端口暴露 --------
          ports:
            - containerPort: 8401 # mall-swarm 认证服务标准端口
          # -------- 环境变量 --------
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
          # -------- 存储卷挂载 --------
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            - name: tmp-volume
              mountPath: /tmp # 新增挂载临时目录
          # -------- 存活探针 --------
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8401
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # -------- 就绪探针 --------
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8401
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # -------- 资源限制 --------
          resources:
            requests:
              cpu: "200m" # 认证服务需要更多 CPU 处理加密操作
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1024Mi"
      # -------- 存储卷定义 --------
      volumes:
        - name: config-volume
          configMap:
            name: mall-auth-config
            items:
              - key: application.yaml
                path: application.yaml
        - name: tmp-volume # 新增 emptyDir 存储卷
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mall-gateway
    component: "gateway"
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app: mall-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mall-gateway
        version: "{{ .Values.image.tag }}"
        component: "gateway"
        team: "mall-team"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8201"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http"
        prometheus.io/interval: "30s"
        business.domain: "ecommerce"
        alert.severity: "critical"
    spec:
      # Pod 级安全配置（保留最基础字段即可）
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      terminationGracePeriodSeconds: 45
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-gateway
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mall-gateway
          image: {{ .Values.image.repository }}/mall-gateway:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8201
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yaml
              subPath: application.yaml
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8201
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8201
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
      volumes:
        - name: config-volume
          configMap:
            name: mall-gateway-config
            items:
              - key: application.yaml
                path: application.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-portal
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mall-portal
    component: "portal-service"
spec:
  replicas: {{ .Values.replicaCount.portal }} # 门户服务直接面向用户，需要更多副本
  selector:
    matchLabels:
      app: mall-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2 # 门户服务可以容忍更多的临时副本
  template:
    metadata:
      labels:
        app: mall-portal
        version: "{{ .Values.image.tag }}"
        component: "portal-service"
        team: "mall-swarm-team"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/scheme: "http"
        business.domain: "ecommerce"
        alert.severity: "high"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        runAsGroup: 1006
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-portal
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mall-portal
          image: {{ .Values.image.repository }}/mall-portal:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # ===== 修正安全字段：移动到 container.securityContext =====
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8085 # mall-swarm 门户服务标准端口
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes,prod"
            - name: SPRING_APPLICATION_NAME
              value: "mall-portal" # 新增，避免占位符无法解析
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            - name: tmp-volume
              mountPath: /tmp # 新增挂载临时目录
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
      volumes:
        - name: config-volume
          configMap:
            name: mall-portal-config
            items:
              - key: application.yaml
                path: application.yaml
        - name: tmp-volume # 新增 emptyDir 存储卷
          emptyDir: {}
