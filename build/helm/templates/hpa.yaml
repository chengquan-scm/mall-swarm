{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if and $serviceConfig.enabled $serviceConfig.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $serviceName }}-hpa
  namespace: {{ $.Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $serviceName }}
  minReplicas: {{ $serviceConfig.hpa.minReplicas }}
  maxReplicas: {{ $serviceConfig.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $serviceConfig.hpa.targetCPUUtilization }}
  {{- if $serviceConfig.hpa.targetMemoryUtilization }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ $serviceConfig.hpa.targetMemoryUtilization }}
  {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $serviceConfig.hpa.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
        {{- toYaml $serviceConfig.hpa.behavior.scaleDown.policies | nindent 8 }}
    scaleUp:
      stabilizationWindowSeconds: {{ $serviceConfig.hpa.behavior.scaleUp.stabilizationWindowSeconds }}
      policies:
        {{- toYaml $serviceConfig.hpa.behavior.scaleUp.policies | nindent 8 }}
{{- end }}
{{- end }}