# Global values
global:
  namespace: master
  imagePullSecrets: harbor-secret
  timezone: Asia/Ho_Chi_Minh
  team: mall-team
  businessDomain: ecommerce
  
# Image settings
image:
  registry: core.harbor.domain
  project: mall-swarm/master
  pullPolicy: IfNotPresent

# Application versions
versions:
  admin: "master-4071364-104"
  auth: "master-4071364-104" 
  gateway: "master-4071364-104"
  portal: "master-4071364-104"
  search: "master-4071364-104"

# Security context settings
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# Services configuration
services:
  admin:
    enabled: true
    replicas: 2
    port: 8082
    component: backend
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    livenessProbe:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      SPRING_APPLICATION_NAME: mall-admin
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilization: 70
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15

  auth:
    enabled: true
    replicas: 2
    port: 8401
    component: auth-service
    securityContext:
      runAsUser: 1004
      runAsGroup: 1004
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 800m
        memory: 1024Mi
    livenessProbe:
      path: /actuator/health/liveness
      initialDelaySeconds: 40
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      path: /actuator/health/readiness
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      SPRING_PROFILES_ACTIVE: kubernetes
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilization: 70
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15

  gateway:
    enabled: true
    replicas: 2
    port: 8201
    component: gateway
    serviceType: LoadBalancer
    servicePorts:
      - name: http
        port: 80
        targetPort: 8201
      - name: https
        port: 443
        targetPort: 8201
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    livenessProbe:
      path: /actuator/health/liveness
      initialDelaySeconds: 40
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      path: /actuator/health/readiness
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      JAVA_OPTS: "-Xmx512m -Xms256m"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilization: 60
      targetMemoryUtilization: 70
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15

  portal:
    enabled: true
    replicas: 2
    port: 8085
    component: portal-service
    securityContext:
      runAsUser: 1006
      runAsGroup: 1006
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi
    livenessProbe:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      path: /actuator/health/readiness
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      SPRING_PROFILES_ACTIVE: "kubernetes,prod"
      SPRING_APPLICATION_NAME: mall-portal
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilization: 75
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 150
              periodSeconds: 10

  search:
    enabled: true
    replicas: 1
    port: 8081
    component: search-service
    securityContext:
      runAsUser: 1005
      runAsGroup: 1005
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2048Mi
    livenessProbe:
      path: /actuator/health/liveness
      initialDelaySeconds: 90
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readinessProbe:
      path: /actuator/health/readiness
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      JAVA_OPTS: "-Xmx1g -Xms512m"
      SPRING_APPLICATION_NAME: mall-search
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilization: 65
      targetMemoryUtilization: 75
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 33
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 200
              periodSeconds: 10

# Pod anti-affinity settings
affinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# Monitoring settings
monitoring:
  prometheus:
    scrape: true
    scheme: http
    interval: 30s
    path: /actuator/prometheus

# Alert severity settings
alerts:
  admin: warning
  auth: critical
  gateway: critical
  portal: high
  search: warning

# Volume settings
volumes:
  tmpVolume: true