apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
spec:
  serviceName: {{ include "mongodb.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "mongodb.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "mongodb.name" . }}
    spec:
      initContainers:
        - name: mongodb-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            [
              "sh",
              "-c",
              "
                echo 'Waiting for MongoDB startup...';
                until mongo --host {{ include "mongodb.fullname" . }} --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do
                  sleep 2;
                done;

                echo 'Initializing DB and user...';

                mongo <<EOF
use {{ .Values.auth.initDatabase }};
db.createUser({
  user: '{{ .Values.auth.rootUser }}',
  pwd: '{{ .Values.auth.rootPassword }}',
  roles: [{ role: 'readWrite', db: '{{ .Values.auth.initDatabase }}' }]
});
EOF

                echo 'MongoDB initialization completed.';
              "
            ]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-auth
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-auth
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /data/db

      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db

          livenessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            timeoutSeconds: 2

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mongodb.fullname" . }}-data
