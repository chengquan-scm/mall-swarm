{{- if .Values.mongodb.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb-mall.name" . }}-secret
  labels:
    {{- include "mongodb-mall.labels" . | nindent 4 }}
type: Opaque
data:
  # 对 root 密码进行 base64 编码
  mongodb-root-password: {{ .Values.mongodb.auth.rootPassword | b64enc | quote }}
{{- end }}