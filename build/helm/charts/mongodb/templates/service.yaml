apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-mall.name" . }}-svc
  labels:
    {{- include "mongodb-mall.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mongodb.service.type }}
  ports:
    - port: {{ .Values.mongodb.service.port }}
      targetPort: mongodb
      protocol: TCP
      name: mongodb
      {{- if and (eq .Values.mongodb.service.type "NodePort") .Values.mongodb.service.nodePort }}
      nodePort: {{ .Values.mongodb.service.nodePort }}
      {{- end }}
  selector:
    {{- include "mongodb-mall.selectorLabels" . | nindent 4 }}