replicaCount: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 3306
  nodePort: 30036

persistence:
  enabled: true
  storageClass: "nfs-client"
  size: 10Gi

auth:
  rootPassword: "Root123!@#"
  createDatabase: true
  database: "mall"
  username: "mall"
  password: "Mall123!@#"

initdb:
  sqlFile: "mall.sql"

configuration: |-
  [mysqld]
  skip-name-resolve
  explicit_defaults_for_timestamp
  datadir=/var/lib/mysql
  socket=/var/lib/mysql/mysql.sock
  max_allowed_packet=16M
  character-set-server=utf8mb4
  collation-server=utf8mb4_unicode_ci
  bind-address=0.0.0.0
  pid-file=/var/run/mysqld/mysqld.pid

  [client]
  port=3306
  socket=/var/lib/mysql/mysql.sock
  default-character-set=utf8mb4


probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30  