apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3306
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
      name: mysql
  selector:
    app: {{ include "mysql.name" . }}
