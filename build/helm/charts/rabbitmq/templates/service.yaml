apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "rabbitmq.name" . }}
  ports:
    - name: amqp
      port: {{ .Values.service.portAMQP }}
      targetPort: 5672
    - name: management
      port: {{ .Values.service.portMgmt }}
      targetPort: 15672
